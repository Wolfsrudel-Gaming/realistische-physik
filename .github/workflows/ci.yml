name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lua:
    name: Lua lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.4 and luacheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4 lua-check

      - name: luacheck
        run: luacheck resources tests tools

      - name: Unit tests
        run: lua5.4 tests/run.lua

      - name: Offline reference simulation
        run: lua5.4 tools/sim/accel.lua

  package:
    name: Release package
    runs-on: ubuntu-latest
    needs: lua
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: |
          mkdir -p dist
          zip -r "dist/wr_physics-${GITHUB_SHA::8}.zip" "resources/[wr_physics]" LICENSE README.md docs
      - uses: actions/upload-artifact@v4
        with:
          name: wr_physics
          path: dist/*.zip
